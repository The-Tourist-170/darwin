services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: darwin
      POSTGRES_PASSWORD: darwin
      POSTGRES_DB: darwin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/darwin123
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4jdata:/data

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"

volumes:
  pgdata:
  qdrantdata:
  neo4jdata:
